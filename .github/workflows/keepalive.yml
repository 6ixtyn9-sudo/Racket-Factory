name: Keepalive - Prevent 60-day disable
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - id: check
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          echo "age_days=$(( (NOW - LAST) / 86400 ))" >> $GITHUB_OUTPUT
      - if: steps.check.outputs.age_days >= 45
        run: |
          git config user.name "racket-factory-bot"
          git config user.email "bot@racket-factory.local"
          date -u > .github/.keepalive
          git add .github/.keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
