name: Autonomous Racket Factory 3-Hour Service

on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - official_morning
          - intraday_only

permissions:
  contents: write
  actions: write

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEYS: ${{ secrets.THE_ODDS_API_KEYS }}
      THE_ODDS_API_SPORT_KEYS: tennis,tennis_atp_us_open,tennis_wta_us_open,tennis_atp_french_open,tennis_wta_french_open,tennis_atp_australian_open,tennis_wta_australian_open,tennis_atp_wimbledon,tennis_wta_wimbledon
      THE_ODDS_API_SPORTS: tennis,tennis_atp_us_open,tennis_wta_us_open,tennis_atp_french_open,tennis_wta_french_open,tennis_atp_australian_open,tennis_wta_australian_open,tennis_atp_wimbledon,tennis_wta_wimbledon
      THE_ODDS_API_REGIONS: uk,eu,us,au
      THE_ODDS_API_CACHE_TTL_MINUTES: '30'
      THE_ODDS_API_DISABLE_CACHE: '0'
      RACKET_FACTORY_DISABLE_THEODDSAPI_SCORES: '0'
      RACKET_FACTORY_REFRESH_ODDSPORTAL: '1'
      RACKET_FACTORY_ODDSPORTAL_DELAY: '60'
      RACKET_FACTORY_FORECAST_MAX_ROWS: '20'
      RACKET_FACTORY_FORECAST_MIN_EV: '0.05'
      RACKET_FACTORY_FORECAST_MIN_CONF: '60'
      RACKET_FACTORY_FORECAST_INCLUDE_NO_ODDS: '0'
      RACKET_FACTORY_FORECAST_INCLUDE_SKIPPED: '0'
      TZ: 'Africa/Johannesburg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install supabase

      - name: Restore localdata state (cache)
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: localdata-v2-main-${{ github.run_id }}
          restore-keys: |
            localdata-v2-main-

      - name: Restore committed data (override stale cache)
        run: |
          set -e
          mkdir -p localdata
          for f in $(git ls-files localdata/); do
            git checkout HEAD -- "$f" && echo "restored committed: $f"
          done

      - name: Execute autonomous smart schedule
        run: |
          MODE='${{ github.event.inputs.mode }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MODE" ] && [ "$MODE" != "auto" ]; then
            echo ">>> Manual mode: $MODE"
            if [ "$MODE" = "official_morning" ]; then
              PYTHONPATH=src python3 scripts/daily.py --force-repick --future-days 2
            elif [ "$MODE" = "intraday_only" ]; then
              PYTHONPATH=src python3 scripts/daily.py --intraday-only --future-days 2
            fi
          else
            PYTHONPATH=src python3 scripts/daily.py --auto-once --future-days 2
          fi

      - name: Persist localdata state (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: localdata
          key: localdata-v2-main-${{ github.run_id }}

      - name: Persist pipeline state to git (Edge-Factory parity)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A localdata/picks_*.json localdata/picks_*.txt localdata/picks_today.json localdata/picks_morning_*.json localdata/picks_next_*.json localdata/picks_forecast_*.json localdata/picks_forecast_*.txt localdata/picks_audit_*.json localdata/picks_audit_*.md localdata/auto_tickets_*.json localdata/auto_tickets_*.txt localdata/auto_tickets_state.json localdata/auto_tickets_performance.json localdata/auto_tickets_today.json localdata/auto_tickets_today.txt localdata/.keepalive 2>/dev/null || true
          git add -A localdata/ 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat: autonomous picks + auto_tickets $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          git pull --rebase --autostash || { git rebase --abort; exit 0; }
          git push || { git pull --rebase --autostash; git push; }

      - name: Upload pick ledgers & reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RacketFactory-Reports
          path: |
            localdata/*.txt
            localdata/*.json
            localdata/*.md
          retention-days: 14
          if-no-files-found: ignore
