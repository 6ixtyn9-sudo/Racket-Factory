name: Autonomous Racket Factory workflow

# REMOVED GitHub triggers - using self-hosted cron + curl per user request
# Previous: schedule '0 5,17 * * *' (07:00 & 19:00 SAST) unreliable, merge conflicts, 429s
# Now: no schedule, only manual dispatch via curl if needed
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (for curl trigger)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - official_morning
          - intraday_only
      force:
        description: 'Force overwrite frozen tickets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  actions: write
  # NOTE: needs workflows: write to push workflow file changes via API
  # Add if you want to allow workflow file updates via GH App:
  # workflows: write

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch'

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEYS: ${{ secrets.THE_ODDS_API_KEYS }}
      THE_ODDS_API_SPORT_KEYS: tennis_atp,tennis_wta
      THE_ODDS_API_SPORTS: tennis_atp,tennis_wta
      THE_ODDS_API_REGIONS: uk,eu,us,au
      THE_ODDS_API_CACHE_TTL_MINUTES: '30'
      BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      THE_ODDS_API_DISABLE_CACHE: '0'
      RACKET_FACTORY_DISABLE_THEODDSAPI_SCORES: '0'
      RACKET_FACTORY_REFRESH_ODDSPORTAL: '0'
      RACKET_FACTORY_ODDSPORTAL_DELAY: '60'
      RACKET_FACTORY_FORECAST_MAX_ROWS: '30'
      RACKET_FACTORY_FORECAST_MIN_EV: '0.05'
      RACKET_FACTORY_FORECAST_MIN_CONF: '60'
      RACKET_FACTORY_FORECAST_INCLUDE_NO_ODDS: '1'
      RACKET_FACTORY_FORECAST_INCLUDE_SKIPPED: '0'
      RACKET_FACTORY_EXPORT_NO_SLICE: '1'
      TZ: 'Africa/Johannesburg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install supabase

      - name: Run test suite (blocking)
        run: |
          PYTHONPATH=src python -m pytest tests/ -q

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install-deps || true

      - name: Restore localdata state (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            localdata/theoddsapi_cache
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          key: localdata-v6-cache-${{ github.run_id }}
          restore-keys: |
            localdata-v6-cache-

      - name: Restore committed data (override stale cache)
        run: |
          set -e
          mkdir -p localdata
          for f in $(git ls-files localdata/); do
            git checkout HEAD -- "$f" && echo "restored committed: $f"
          done

      - name: Execute autonomous smart schedule
        run: |
          MODE='${{ github.event.inputs.mode }}'
          FORCE='${{ github.event.inputs.force }}'
          if [ -n "$MODE" ] && [ "$MODE" != "auto" ]; then
            echo ">>> Manual mode: $MODE force:$FORCE"
            if [ "$MODE" = "official_morning" ]; then
              PYTHONPATH=src python3 scripts/daily.py --force-repick --future-days 2
            elif [ "$MODE" = "intraday_only" ]; then
              PYTHONPATH=src python3 scripts/daily.py --intraday-only --future-days 2
            fi
          else
            PYTHONPATH=src python3 scripts/daily.py --auto-once --future-days 2
          fi

      - name: Pipeline health gate
        run: |
          PYTHONPATH=src python3 -m racketfactory.doctor --expect-warehouse --write-report

      - name: Persist localdata state (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            localdata/theoddsapi_cache
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          key: localdata-v6-cache-${{ github.run_id }}

      - name: Persist pipeline state to git
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Cleaning legacy files (keep dated pick archives — audit needs full history)..."
          rm -f localdata/picks_morning_*.json || true
          rm -f localdata/picks_audit_2026-0[6-8]-*.md localdata/picks_audit_2026-09-0[1-9].md localdata/picks_audit_2026-09-10.md || true
          rm -f localdata/picks_audit_forecast_*.md localdata/picks_forecast_2026-0[6-8]-*.json localdata/picks_forecast_2026-0[6-8]-*.txt localdata/picks_forecast_2026-09-0[1-9].* localdata/picks_forecast_2026-09-10.* || true
          rm -f localdata/tennisdata_tennis_*.csv.gz || true
          echo "Pruning slice_table artifacts older than 30 days (retention)..."
          find localdata -name "slice_table_*.json" -type f -mtime +30 -print -delete || true
          echo "Cleaning transient warehouse baseline (not committed)..."
          rm -f localdata/warehouse_baseline.csv.gz || true
          echo "Current localdata inventory after prune:"
          ls -lh localdata/ | tail -n 100 || true
          echo "Warehouse + slice_table status:"
          ls -lh localdata/warehouse.csv.gz localdata/warehouse_merge_report.json localdata/slice_table_*.json 2>&1 | head -n 20 || true
          git add -A localdata/ 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat: autonomous picks + auto_tickets $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          git pull --rebase --autostash || { git rebase --abort; git pull --no-rebase || true; }
          git push || { git pull --rebase --autostash; git push; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RacketFactory-Reports
          path: |
            localdata/*.txt
            localdata/*.json
            localdata/*.md
            localdata/*.log
            localdata/*.csv.gz
          retention-days: 14
