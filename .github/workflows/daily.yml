name: Autonomous Racket Factory workflow

# REMOVED GitHub triggers - using self-hosted cron + curl per user request
# Previous: schedule '0 5,17 * * *' (07:00 & 19:00 SAST) unreliable, merge conflicts, 429s
# Now: no schedule, only manual dispatch via curl if needed
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (for curl trigger)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - official_morning
          - intraday_only
      force:
        description: 'Guarded same-day empty-card rebuild (auto mode only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  actions: write
  # NOTE: needs workflows: write to push workflow file changes via API
  # Add if you want to allow workflow file updates via GH App:
  # workflows: write

jobs:
  run-autonomous-agent:
    # One group covers every mode of this workflow. It never cancels a running job.
    concurrency:
      group: racket-factory-financial-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch'

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEYS: ${{ secrets.THE_ODDS_API_KEYS }}
      THE_ODDS_API_SPORT_KEYS: tennis_atp,tennis_wta
      THE_ODDS_API_SPORTS: tennis_atp,tennis_wta
      THE_ODDS_API_REGIONS: uk,eu,us,au
      THE_ODDS_API_CACHE_TTL_MINUTES: '30'
      BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      RACKET_FACTORY_DISABLE_FOREBET: '1'
      THE_ODDS_API_DISABLE_CACHE: '0'
      RACKET_FACTORY_DISABLE_THEODDSAPI_SCORES: '0'
      RACKET_FACTORY_REFRESH_ODDSPORTAL: '0'
      RACKET_FACTORY_ODDSPORTAL_DELAY: '60'
      RACKET_FACTORY_FORECAST_MAX_ROWS: '30'
      RACKET_FACTORY_FORECAST_MIN_EV: '0.05'
      RACKET_FACTORY_FORECAST_MIN_CONF: '60'
      RACKET_FACTORY_FORECAST_INCLUDE_NO_ODDS: '1'
      RACKET_FACTORY_FORECAST_INCLUDE_SKIPPED: '0'
      RACKET_FACTORY_EXPORT_NO_SLICE: '1'
      TZ: 'Africa/Johannesburg'

    steps:
      - name: Validate manual inputs
        id: input_gate
        env:
          MODE: ${{ github.event.inputs.mode }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          case "$FORCE" in
            ''|false) ;;
            true)
              if [ "$MODE" != 'auto' ] && [ -n "$MODE" ]; then
                echo 'force=true requires mode=auto; intraday_only conflicts' >&2
                exit 1
              fi
              if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
                echo 'guarded rebuild is permitted only from main' >&2
                exit 1
              fi ;;
            *) echo 'Invalid force input; expected true or false' >&2; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the latest branch tip after the workflow concurrency lock.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (blocking)
        env:
          SUPABASE_URL: ''
          SUPABASE_KEY: ''
          SUPABASE_SERVICE_KEY: ''
          CALLMEBOT_APIKEY: ''
          CALLMEBOT_PHONE: ''
          THE_ODDS_API_KEY: ''
          THE_ODDS_API_KEYS: ''
          BZZOIRO_TOKEN: ''
          JINA_API_KEY: ''
          JINA_READER_API_KEY: ''
        run: |
          PYTHONPATH=src python -m pytest tests/ -q

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore localdata state (cache)
        uses: actions/cache/restore@v4
        with:
          # Disposable data only; never the authority for request budgets.
          path: |
            localdata/theoddsapi_odds_cache_*.json
            localdata/theoddsapi_scores_cache_*.json
            localdata/theoddsapi_sports_cache.json
            localdata/theoddsapi_usage.json
            localdata/quota/*.marker
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          key: localdata-v7-cache-${{ github.run_id }}
          restore-keys: |
            localdata-v7-cache-

      - name: Restore committed data (override stale cache)
        run: |
          set -e
          mkdir -p localdata
          for f in $(git ls-files localdata/); do
            git checkout HEAD -- "$f" && echo "restored committed: $f"
          done

      - name: Execute autonomous smart schedule
        id: execute
        run: |
          MODE='${{ github.event.inputs.mode }}'
          FORCE='${{ github.event.inputs.force }}'
          if [ -n "$MODE" ] && [ "$MODE" != "auto" ]; then
            echo ">>> Manual mode: $MODE force:$FORCE"
            if [ "$MODE" = "official_morning" ]; then
              # Explicit morning mode is already a full run; never pass the
              # ticket builder's --force or bypass its frozen-output guard.
              PYTHONPATH=src python3 scripts/daily.py --future-days 2
            elif [ "$MODE" = "intraday_only" ]; then
              if [ "$FORCE" = "true" ]; then
                echo "force requests a full run and conflicts with intraday_only" >&2
                exit 1
              fi
              PYTHONPATH=src python3 scripts/daily.py --intraday-only --future-days 2
            fi
          else
            if [ "$FORCE" = "true" ]; then
              RACKET_FACTORY_REBUILD_SERIALIZED=1 PYTHONPATH=src python3 scripts/daily.py --guarded-rebuild
            else
              PYTHONPATH=src python3 scripts/daily.py --auto-once --future-days 2
            fi
          fi

      - name: Pipeline health gate
        id: health
        if: ${{ !cancelled() && steps.execute.outcome != 'skipped' }}
        run: |
          PYTHONPATH=src python3 -m racketfactory.doctor --expect-warehouse --write-report

      - name: Persist localdata state (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          # Disposable data only; never the authority for request budgets.
          path: |
            localdata/theoddsapi_odds_cache_*.json
            localdata/theoddsapi_scores_cache_*.json
            localdata/theoddsapi_sports_cache.json
            localdata/theoddsapi_usage.json
            localdata/quota/*.marker
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          key: localdata-v7-cache-${{ github.run_id }}

      - name: Persist pipeline state to git
        id: publication
        if: ${{ always() && steps.input_gate.outcome == 'success' && (github.event.inputs.force != 'true' || (steps.execute.outcome == 'success' && steps.health.outcome == 'success')) }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ '${{ github.event.inputs.force }}' != 'true' ]; then
            echo "Cleaning legacy files (keep dated pick archives — audit needs full history)..."
            rm -f localdata/picks_morning_*.json || true
            rm -f localdata/picks_audit_2026-0[6-8]-*.md localdata/picks_audit_2026-09-0[1-9].md localdata/picks_audit_2026-09-10.md || true
            rm -f localdata/picks_audit_forecast_*.md localdata/picks_forecast_2026-0[6-8]-*.json localdata/picks_forecast_2026-0[6-8]-*.txt localdata/picks_forecast_2026-09-0[1-9].* localdata/picks_forecast_2026-09-10.* || true
            rm -f localdata/tennisdata_tennis_*.csv.gz || true
            echo "Pruning slice_table artifacts older than 30 days (retention)..."
            find localdata -name "slice_table_*.json" -type f -mtime +30 -print -delete || true
            echo "Cleaning transient warehouse baseline (not committed)..."
            rm -f localdata/warehouse_baseline.csv.gz || true
            echo "Current localdata inventory after prune:"
            ls -lh localdata/ | tail -n 100 || true
            echo "Warehouse + slice_table status:"
            ls -lh localdata/warehouse.csv.gz localdata/warehouse_merge_report.json localdata/slice_table_*.json 2>&1 | head -n 20 || true
            git add -A localdata/ 2>/dev/null || true
          fi
          if [ '${{ github.event.inputs.force }}' = 'true' ]; then
            day="$(TZ=Africa/Johannesburg date +%F)"
            git add -A -- "localdata/auto_tickets_${day}.json" "localdata/auto_tickets_${day}.txt" \
              localdata/auto_tickets_today.json localdata/auto_tickets_today.txt localdata/auto_tickets_state.json
            # The archive is non-actionable but must survive the runner.
            archive="localdata/.auto_tickets_rebuild/archive_$(TZ=Africa/Johannesburg date +%F)_${GITHUB_RUN_ID}.json"
            test -f "$archive" || { echo 'missing rebuild archive' >&2; exit 1; }
            git add -f -- "$archive"
            baseline="$(git rev-parse HEAD)"
            git fetch origin "refs/heads/${GITHUB_REF_NAME}"
            if [ "$(git rev-parse FETCH_HEAD)" != "$baseline" ]; then
              echo 'authoritative branch changed after checkout; refusing publication' >&2
              exit 1
            fi
            git diff --cached --quiet && { echo 'no rebuild changes'; exit 0; }
            git commit -m "feat: guarded empty-card rebuild $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
            # A non-fast-forward is a conflict, never rebase financial state.
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          else
            git diff --cached --quiet && echo "no changes" && exit 0
            git commit -m "feat: autonomous picks + auto_tickets $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
            git pull --rebase --autostash || { git rebase --abort; git pull --no-rebase || true; }
            git push || { git pull --rebase --autostash; git push; }
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.input_gate.outcome == 'success' && (github.event.inputs.force != 'true' || steps.publication.outcome == 'success') }}
        with:
          name: RacketFactory-Reports
          path: |
            localdata/*.txt
            localdata/*.json
            localdata/*.md
            localdata/*.log
            localdata/*.csv.gz
          retention-days: 14
