name: Autonomous Racket Factory 3-Hour Service

on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - official_morning
          - intraday_only

permissions:
  contents: write
  actions: write

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEYS: ${{ secrets.THE_ODDS_API_KEYS }}
      THE_ODDS_API_SPORT_KEYS: tennis_atp_us_open,tennis_wta_us_open,tennis_atp_french_open,tennis_wta_french_open,tennis_atp_australian_open,tennis_wta_australian_open,tennis_atp_wimbledon,tennis_wta_wimbledon
      THE_ODDS_API_SPORTS: tennis_atp_us_open,tennis_wta_us_open,tennis_atp_french_open,tennis_wta_french_open,tennis_atp_australian_open,tennis_wta_australian_open,tennis_atp_wimbledon,tennis_wta_wimbledon
      THE_ODDS_API_REGIONS: uk,eu,us,au
      THE_ODDS_API_CACHE_TTL_MINUTES: '30'
      BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
      THE_ODDS_API_DISABLE_CACHE: '0'
      RACKET_FACTORY_DISABLE_THEODDSAPI_SCORES: '0'
      RACKET_FACTORY_REFRESH_ODDSPORTAL: '0'
      RACKET_FACTORY_ODDSPORTAL_DELAY: '60'
      RACKET_FACTORY_FORECAST_MAX_ROWS: '30'
      RACKET_FACTORY_FORECAST_MIN_EV: '0.05'
      RACKET_FACTORY_FORECAST_MIN_CONF: '60'
      RACKET_FACTORY_FORECAST_INCLUDE_NO_ODDS: '1'
      RACKET_FACTORY_FORECAST_INCLUDE_SKIPPED: '0'
      TZ: 'Africa/Johannesburg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install supabase

      - name: Run test suite (blocking)
        run: |
          PYTHONPATH=src python -m pytest tests/ -q

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install-deps || true

      - name: Restore localdata state (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            localdata/theoddsapi_cache
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          key: localdata-v4-cache-${{ github.run_id }}
          restore-keys: |
            localdata-v4-cache-

      - name: Restore committed data (override stale cache)
        run: |
          set -e
          mkdir -p localdata
          for f in $(git ls-files localdata/); do
            git checkout HEAD -- "$f" && echo "restored committed: $f"
          done

      - name: Execute autonomous smart schedule
        run: |
          MODE='${{ github.event.inputs.mode }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MODE" ] && [ "$MODE" != "auto" ]; then
            echo ">>> Manual mode: $MODE"
            if [ "$MODE" = "official_morning" ]; then
              PYTHONPATH=src python3 scripts/daily.py --force-repick --future-days 2
            elif [ "$MODE" = "intraday_only" ]; then
              PYTHONPATH=src python3 scripts/daily.py --intraday-only --future-days 2
            fi
          else
            PYTHONPATH=src python3 scripts/daily.py --auto-once --future-days 2
          fi

      - name: Pipeline health gate (blocking on CRITICAL)
        run: |
          PYTHONPATH=src python3 -m racketfactory.doctor --expect-warehouse --write-report

      - name: Persist localdata state (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            localdata/theoddsapi_cache
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          key: localdata-v4-cache-${{ github.run_id }}

      - name: Persist pipeline state to git (Edge-Factory parity)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Clean up any untracked legacy files that cache may have restored but are not in repo
          # Keep only last 3 days of picks to avoid messy file list (user complaint: 11 files)
          echo "Cleaning cache-restored legacy files..."
          # Remove old picks (keep only last 3 days) - will be recalculated
          # First, list files older than 3 days and remove
          find localdata -name "picks_2026-*.json" -o -name "picks_2026-*.txt" | while read f; do
            # Extract date from filename picks_YYYY-MM-DD.json
            d=$(echo "$f" | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}" | head -1)
            if [ -n "$d" ]; then
              # If file date is more than 3 days old, delete
              if [ "$(date -d "$d" +%s 2>/dev/null || echo 0)" -lt "$(date -d "3 days ago" +%s)" ]; then
                echo "Removing old $f"
                rm -f "$f"
              fi
            fi
          done || true
          # Also remove specific old patterns (June-Aug + early Sept)
          rm -f localdata/picks_2026-0[6-8]-*.json localdata/picks_2026-0[6-8]-*.txt localdata/picks_2026-09-0[1-9].json localdata/picks_2026-09-0[1-9].txt localdata/picks_2026-09-10.json localdata/picks_2026-09-10.txt || true
          rm -f localdata/picks_morning_*.json || true
          rm -f localdata/picks_morning_2026-0[6-8]-*.json localdata/picks_morning_2026-09-0[1-9].json localdata/picks_morning_2026-09-10.json || true
          rm -f localdata/picks_audit_2026-0[6-8]-*.md localdata/picks_audit_2026-09-0[1-9].md localdata/picks_audit_2026-09-10.md || true
          rm -f localdata/picks_audit_forecast_*.md localdata/picks_forecast_2026-0[6-8]-*.json localdata/picks_forecast_2026-0[6-8]-*.txt localdata/picks_forecast_2026-09-0[1-9].* localdata/picks_forecast_2026-09-10.* || true
          # Clean up old morning/audit files older than 3 days similarly
          find localdata -name "picks_morning_*.json" -o -name "picks_audit_*.md" | while read f; do
            d=$(echo "$f" | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}" | head -1)
            if [ -n "$d" ]; then
              if [ "$(date -d "$d" +%s 2>/dev/null || echo 0)" -lt "$(date -d "3 days ago" +%s)" ]; then
                echo "Removing old $f"
                rm -f "$f"
              fi
            fi
          done || true
          # No morning files per user request (focus on autobets only)
          rm -f localdata/picks_morning_*.json || true
          # Dead-source guard: tennisdata files must never be recommitted (cache resurrection, run #214)
          rm -f localdata/tennisdata_tennis_*.csv.gz || true
          git add -A localdata/picks_*.json localdata/picks_*.txt localdata/picks_today.json localdata/picks_next_*.json localdata/picks_forecast_*.json localdata/picks_forecast_*.txt localdata/picks_audit_*.json localdata/picks_audit_*.md localdata/auto_tickets_*.json localdata/auto_tickets_*.txt localdata/auto_tickets_state.json localdata/auto_tickets_performance.json localdata/auto_tickets_today.json localdata/auto_tickets_today.txt localdata/pipeline_health.json localdata/.keepalive 2>/dev/null || true
          git add -A localdata/ 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat: autonomous picks + auto_tickets $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          git pull --rebase --autostash || { echo "rebase failed, attempting merge"; git rebase --abort; git pull --no-rebase || true; }
          git push || { echo "push failed, retry after pull"; git pull --rebase --autostash; git push; }
          echo "persist succeeded"

      - name: Upload pick ledgers & reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RacketFactory-Reports
          path: |
            localdata/*.txt
            localdata/*.json
            localdata/*.md
            localdata/*.log
            localdata/*.csv.gz
            localdata/*.gz
          retention-days: 14
          if-no-files-found: ignore
