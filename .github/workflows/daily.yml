name: Autonomous Racket Factory workflow

# REMOVED GitHub triggers - using self-hosted cron + curl per user request
# Previous: schedule '0 5,17 * * *' (07:00 & 19:00 SAST) unreliable, merge conflicts, 429s
# Now: no schedule, only manual dispatch via curl if needed
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (for curl trigger)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - official_morning
          - intraday_only
          - evidence_only
      force:
        description: 'Guarded same-day empty-card rebuild (auto mode only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  actions: write
  # NOTE: needs workflows: write to push workflow file changes via API
  # Add if you want to allow workflow file updates via GH App:
  # workflows: write

jobs:
  run-autonomous-agent:
    # One group covers every mode of this workflow. It never cancels a running job.
    concurrency:
      group: racket-factory-financial-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch'

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEYS: ${{ secrets.THE_ODDS_API_KEYS }}
      THE_ODDS_API_SPORT_KEYS: tennis_atp,tennis_wta
      THE_ODDS_API_SPORTS: tennis_atp,tennis_wta
      THE_ODDS_API_REGIONS: uk,eu,us,au
      THE_ODDS_API_CACHE_TTL_MINUTES: '30'
      BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      RACKET_FACTORY_DISABLE_FOREBET: '1'
      THE_ODDS_API_DISABLE_CACHE: '0'
      RACKET_FACTORY_DISABLE_THEODDSAPI_SCORES: '0'
      RACKET_FACTORY_REFRESH_ODDSPORTAL: '0'
      RACKET_FACTORY_ODDSPORTAL_DELAY: '60'
      RACKET_FACTORY_FORECAST_MAX_ROWS: '30'
      RACKET_FACTORY_FORECAST_MIN_EV: '0.05'
      RACKET_FACTORY_FORECAST_MIN_CONF: '60'
      RACKET_FACTORY_FORECAST_INCLUDE_NO_ODDS: '1'
      RACKET_FACTORY_FORECAST_INCLUDE_SKIPPED: '0'
      RACKET_FACTORY_EXPORT_NO_SLICE: '1'
      TZ: 'Africa/Johannesburg'

    steps:
      - name: Validate manual inputs
        id: input_gate
        env:
          MODE: ${{ github.event.inputs.mode }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          case "$MODE" in
            ''|auto|official_morning|intraday_only|evidence_only) ;;
            *) echo 'Invalid execution mode' >&2; exit 1 ;;
          esac
          case "$FORCE" in
            ''|false) ;;
            true)
              if [ "$MODE" != 'auto' ] && [ -n "$MODE" ]; then
                echo 'force=true requires mode=auto; intraday_only conflicts' >&2
                exit 1
              fi
              if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
                echo 'guarded rebuild is permitted only from main' >&2
                exit 1
              fi ;;
            *) echo 'Invalid force input; expected true or false' >&2; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the latest branch tip after the workflow concurrency lock.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize run diagnostics
        id: diagnostics_init
        run: |
          set -e
          d="$RUNNER_TEMP/racket-rebuild-diagnostics"
          mkdir -p "$d"
          printf 'checkout_sha=%s\nrun_id=%s\nrun_attempt=%s\npython=%s\n' \
            "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(python --version 2>&1)" > "$d/run_identity.txt"

      - name: Run test suite (blocking)
        id: tests
        env:
          SUPABASE_URL: ''
          SUPABASE_KEY: ''
          SUPABASE_SERVICE_KEY: ''
          CALLMEBOT_APIKEY: ''
          CALLMEBOT_PHONE: ''
          THE_ODDS_API_KEY: ''
          THE_ODDS_API_KEYS: ''
          BZZOIRO_TOKEN: ''
          JINA_API_KEY: ''
          JINA_READER_API_KEY: ''
        run: |
          set +e
          d="$RUNNER_TEMP/racket-rebuild-diagnostics"
          PYTHONPATH=src python -m pytest tests/ -q --junitxml="$d/pytest-junit.xml" 2>&1 | tee "$d/pytest-output.txt"
          statuses=("${PIPESTATUS[@]}")
          printf 'pytest_exit_code=%s\ntee_exit_code=%s\n' "${statuses[0]}" "${statuses[1]}" > "$d/pytest-status.txt"
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Discard test-created localdata in runner checkout
        id: test_cleanup
        run: |
          git restore --source=HEAD --worktree --staged -- localdata
          git clean -fdx -- localdata

      # Evidence mode performs up to two listing pages and two match/comparison
      # requests. It never runs the pipeline or publishes a card.
      - name: Capture bounded BetExplorer evidence only
        id: evidence
        if: ${{ github.event.inputs.mode == 'evidence_only' }}
        env:
          RACKET_FACTORY_REBUILD_DIAGNOSTICS_DIR: ${{ runner.temp }}/racket-rebuild-diagnostics
        run: |
          PYTHONPATH=src python scripts/capture_betexplorer_evidence.py

      - name: Restore localdata state (cache)
        id: cache_restore
        if: ${{ github.event.inputs.mode != 'evidence_only' }}
        uses: actions/cache/restore@v4
        with:
          # Disposable data only; never the authority for request budgets.
          path: |
            localdata/theoddsapi_odds_cache_*.json
            localdata/theoddsapi_scores_cache_*.json
            localdata/theoddsapi_sports_cache.json
            localdata/theoddsapi_usage.json
            localdata/quota/*.marker
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          # The prior successful run is an exact, non-suspect migration
          # fallback. Never use the broad v7 prefix (40926551091 is suspect).
          key: localdata-v8-production-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            localdata-v8-production-
            localdata-v7-cache-40916173195

      - name: Restore committed data (override stale cache)
        id: committed_restore
        if: ${{ github.event.inputs.mode != 'evidence_only' }}
        run: |
          set -e
          matched='${{ steps.cache_restore.outputs.cache-matched-key }}'
          case "$matched" in
            ''|localdata-v8-production-*) ;;
            localdata-v7-cache-40916173195) ;;
            *) echo "Unexpected cache key; refusing restored data" >&2; exit 1 ;;
          esac
          mkdir -p localdata
          git restore --source=HEAD --worktree --staged -- localdata

      - name: Execute autonomous smart schedule
        id: execute
        if: ${{ github.event.inputs.mode != 'evidence_only' }}
        env:
          RACKET_FACTORY_REBUILD_DIAGNOSTICS_DIR: ${{ runner.temp }}/racket-rebuild-diagnostics
          # No external publication until Git has accepted the card.
          SUPABASE_URL: ''
        run: |
          day="$(TZ=Africa/Johannesburg date +%F)"
          echo "target_date=$day" >> "$GITHUB_OUTPUT"
          marker="localdata/.publication_runs/${GITHUB_RUN_ID}"
          if git cat-file -e "HEAD:$marker" 2>/dev/null; then
            echo 'Run already published; do not repeat execution or notification.'
            echo 'already_published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'production_started=true' >> "$GITHUB_OUTPUT"
          MODE='${{ github.event.inputs.mode }}'
          FORCE='${{ github.event.inputs.force }}'
          if [ -n "$MODE" ] && [ "$MODE" != "auto" ]; then
            echo ">>> Manual mode: $MODE force:$FORCE"
            if [ "$MODE" = "official_morning" ]; then
              # Explicit morning mode is already a full run; never pass the
              # ticket builder's --force or bypass its frozen-output guard.
              PYTHONPATH=src python3 scripts/daily.py --date "$day" --skip-notify --future-days 2
            elif [ "$MODE" = "intraday_only" ]; then
              if [ "$FORCE" = "true" ]; then
                echo "force requests a full run and conflicts with intraday_only" >&2
                exit 1
              fi
              PYTHONPATH=src python3 scripts/daily.py --date "$day" --skip-notify --intraday-only --future-days 2
            fi
          else
            if [ "$FORCE" = "true" ]; then
              RACKET_FACTORY_REBUILD_SERIALIZED=1 PYTHONPATH=src python3 scripts/daily.py --date "$day" --guarded-rebuild
            else
              PYTHONPATH=src python3 scripts/daily.py --date "$day" --skip-notify --auto-once --future-days 2
            fi
          fi

      - name: Pipeline health gate
        id: health
        if: ${{ !cancelled() && steps.execute.outcome != 'skipped' }}
        env:
          RACKET_FACTORY_REBUILD_DIAGNOSTICS_DIR: ${{ runner.temp }}/racket-rebuild-diagnostics
        run: |
          if [ '${{ steps.execute.outputs.already_published }}' = 'true' ]; then
            echo 'Previously published run; no new health or publication.'
          elif [ '${{ github.event.inputs.force }}' = 'true' ]; then
            PYTHONPATH=src python3 -m racketfactory.doctor --expect-warehouse --expect-rebuild --write-report --report-path "$RUNNER_TEMP/racket-rebuild-diagnostics/pipeline_health.json"
          else
            PYTHONPATH=src python3 -m racketfactory.doctor --expect-warehouse --write-report --report-path "$RUNNER_TEMP/racket-rebuild-diagnostics/pipeline_health.json"
          fi

      - name: Persist localdata state (cache)
        uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.test_cleanup.outcome == 'success' && steps.cache_restore.outcome == 'success' && steps.committed_restore.outcome == 'success' && steps.execute.outcome == 'success' && steps.execute.outputs.production_started == 'true' && steps.health.outcome == 'success' }}
        with:
          # Disposable data only; never the authority for request budgets.
          path: |
            localdata/theoddsapi_odds_cache_*.json
            localdata/theoddsapi_scores_cache_*.json
            localdata/theoddsapi_sports_cache.json
            localdata/theoddsapi_usage.json
            localdata/quota/*.marker
            localdata/oddsportal_cache
            localdata/fetch_cache
            localdata/*.csv.gz
          key: localdata-v8-production-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist pipeline state to git
        id: publication
        if: ${{ !cancelled() && steps.input_gate.outcome == 'success' && steps.tests.outcome == 'success' && steps.execute.outcome == 'success' && steps.health.outcome == 'success' && steps.execute.outputs.already_published != 'true' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          baseline="$(git rev-parse HEAD)"
          git fetch origin "refs/heads/${GITHUB_REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" != "$baseline" ]; then
            echo 'authoritative branch changed after checkout; refusing publication' >&2
            exit 1
          fi
          if [ '${{ github.event.inputs.force }}' != 'true' ]; then
            echo "Cleaning legacy files (keep dated pick archives — audit needs full history)..."
            rm -f localdata/picks_morning_*.json || true
            rm -f localdata/picks_audit_2026-0[6-8]-*.md localdata/picks_audit_2026-09-0[1-9].md localdata/picks_audit_2026-09-10.md || true
            rm -f localdata/picks_audit_forecast_*.md localdata/picks_forecast_2026-0[6-8]-*.json localdata/picks_forecast_2026-0[6-8]-*.txt localdata/picks_forecast_2026-09-0[1-9].* localdata/picks_forecast_2026-09-10.* || true
            rm -f localdata/tennisdata_tennis_*.csv.gz || true
            echo "Pruning slice_table artifacts older than 30 days (retention)..."
            find localdata -name "slice_table_*.json" -type f -mtime +30 -print -delete || true
            echo "Cleaning transient warehouse baseline (not committed)..."
            rm -f localdata/warehouse_baseline.csv.gz || true
            echo "Current localdata inventory after prune:"
            ls -lh localdata/ | tail -n 100 || true
            echo "Warehouse + slice_table status:"
            ls -lh localdata/warehouse.csv.gz localdata/warehouse_merge_report.json localdata/slice_table_*.json 2>&1 | head -n 20 || true
            git add -A localdata/
          fi
          if [ '${{ github.event.inputs.force }}' = 'true' ]; then
            day='${{ steps.execute.outputs.target_date }}'
            [ "$day" = "$(TZ=Africa/Johannesburg date +%F)" ] || { echo 'betting day changed; refusing publication' >&2; exit 1; }
            git add -A -- "localdata/auto_tickets_${day}.json" "localdata/auto_tickets_${day}.txt" \
              localdata/auto_tickets_today.json localdata/auto_tickets_today.txt localdata/auto_tickets_state.json
            # The archive is non-actionable but must survive the runner.
            archive="localdata/.auto_tickets_rebuild/archive_${day}_${GITHUB_RUN_ID}.json"
            test -f "$archive" || { echo 'missing rebuild archive' >&2; exit 1; }
            git add -f -- "$archive"
          fi
          # At-most-once per run ID; a crash after push can lose an alert.
          marker="localdata/.publication_runs/${GITHUB_RUN_ID}"
          mkdir -p "$(dirname "$marker")"
          printf '%s\n' "${GITHUB_RUN_ID}" > "$marker"
          git add -f -- "$marker"
          git commit -m "feat: autonomous picks + auto_tickets $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          # Recheck newly changed tickets against the original Git baseline at
          # the real publication boundary. Historical retained cards are not
          # relabelled as current or regraded.
          PYTHONPATH=src python3 scripts/validate_ticket_publication.py --date '${{ steps.execute.outputs.target_date }}' --baseline "$baseline"
          # A concurrent update is a failure, never rebase financial state.
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo 'published_new=true' >> "$GITHUB_OUTPUT"

      - name: Publish dashboard and notify after Git push
        if: ${{ steps.publication.outcome == 'success' && steps.publication.outputs.published_new == 'true' && github.event.inputs.force != 'true' }}
        run: |
          day='${{ steps.execute.outputs.target_date }}'
          picks="localdata/picks_${day}.json"
          if [ -n "$SUPABASE_URL" ]; then
            PYTHONPATH=src python3 scripts/sync_supabase.py --picks "$picks" --target-date "$day" --replace-date || echo 'Dashboard sync failed after publication'
          fi
          # A retained historical card or an empty current evaluation is not
          # an actionable ticket. Recheck current-run identity and freshness.
          evaluation="localdata/auto_tickets_evaluation_${day}.json"
          if [ -n "$CALLMEBOT_APIKEY" ] && [ -n "$CALLMEBOT_PHONE" ] && \
             python3 -c 'import json, os, sys; d=json.load(open(sys.argv[1])); sys.exit(not (d.get("github_run_id") == os.environ.get("GITHUB_RUN_ID") and d.get("github_run_attempt") == os.environ.get("GITHUB_RUN_ATTEMPT") and d.get("publication") == "local_write" and d.get("priced_tickets", 0) > 0))' "$evaluation" && \
             PYTHONPATH=src python3 scripts/validate_ticket_publication.py --date "$day" --baseline HEAD^; then
            # Notify only legs actually present in the newly published priced
            # multi-leg tickets, never every otherwise-exported prediction.
            notify_picks="$RUNNER_TEMP/racket-published-ticket-legs.json"
            python3 -c 'import json,sys; c=json.load(open(sys.argv[1])); legs=[dict(l, pick=l.get("selected_player")) for a in c.get("accas", []) if not a.get("paper") for l in a.get("legs", [])]; json.dump(legs, open(sys.argv[2], "w"))' "localdata/auto_tickets_${day}.json" "$notify_picks"
            PYTHONPATH=src python3 scripts/notify_whatsapp.py --date "$day" --picks "$notify_picks" || echo 'Notification failed after publication'
          else
            echo 'No current fresh priced ticket to notify.'
          fi

      - name: Finalize diagnostic run status
        if: ${{ always() && steps.diagnostics_init.outcome == 'success' }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          PRODUCTION_STARTED: ${{ steps.execute.outputs.production_started }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          PUBLISHED_NEW: ${{ steps.publication.outputs.published_new }}
          FORCE: ${{ github.event.inputs.force }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          d = Path(os.environ['RUNNER_TEMP']) / 'racket-rebuild-diagnostics'
          env = os.environ
          started = env.get('PRODUCTION_STARTED') == 'true'
          rebuild = 'not_attempted' if not started or env.get('FORCE') != 'true' else 'attempted'
          collection = 'not_attempted' if not started else 'unknown'
          status_file = d / 'rebuild_status.json'
          if started and env.get('FORCE') == 'true' and status_file.exists():
              try:
                  record = json.loads(status_file.read_text())
                  stage = record.get('stage', '')
                  collection = 'attempted' if stage.startswith('collecting') or stage in ('collection_complete', 'validating_and_staging_quotes', 'ticket_generation', 'local_publication', 'awaiting_git_publication') else 'not_attempted'
              except (OSError, ValueError):
                  collection = 'unknown'
          evidence_file = d / 'evidence_collection.json'
          if evidence_file.exists():
              try:
                  collection = 'attempted' if json.loads(evidence_file.read_text()).get('listing_attempted') else 'not_attempted'
              except (OSError, ValueError):
                  collection = 'unknown'
          elif env.get('EVIDENCE_OUTCOME') not in ('', 'skipped'):
              collection = 'unknown'
          result = {'test_outcome': env.get('TEST_OUTCOME'), 'execute_outcome': env.get('EXECUTE_OUTCOME'),
                    'collection': collection, 'guarded_rebuild': rebuild,
                    'publication_step': 'not_attempted' if env.get('PUBLICATION_OUTCOME') in ('', 'skipped') else 'attempted',
                    'publication_outcome': env.get('PUBLICATION_OUTCOME'),
                    'new_git_publication_confirmed': env.get('PUBLISHED_NEW') == 'true',
                    'evidence_outcome': env.get('EVIDENCE_OUTCOME'), 'mode': env.get('MODE')}
          (d / 'run_status.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          PYCODE

      - name: Upload quote and rebuild diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: RacketFactory-Rebuild-Diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/racket-rebuild-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.input_gate.outcome == 'success' && steps.publication.outcome == 'success' && steps.publication.outputs.published_new == 'true' }}
        with:
          name: RacketFactory-Reports
          path: |
            localdata/*.txt
            localdata/*.json
            localdata/*.md
            localdata/*.log
            localdata/*.csv.gz
          retention-days: 14
